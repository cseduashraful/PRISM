name: prism-pyg
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.*
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - pyyaml
  - tqdm
  - requests
  - beautifulsoup4
  - gdown
  - clint
  - pybind11
  - ninja
  - setuptools
  - cmake
  - cxx-compiler
  - gcc_linux-64
  - gxx_linux-64
  - pytorch=2.2.*
  - pytorch-cuda=11.8
  - pyg=2.5.*
  - cuda-nvcc=11.8
  - pip:
      - -f https://data.pyg.org/whl/torch-2.2.0+cu118.html
      - torch-scatter
      - torch-sparse
      - py-tgb==2.0.0
